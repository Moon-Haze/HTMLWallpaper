name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# 同一分支/PR 并发触发时取消旧运行，避免浪费 runner。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- amd64：KDE neon 容器方案 ----------
  build-amd64:
    name: 构建与测试 (amd64)
    runs-on: ubuntu-latest
    # KDE neon 容器：预装最新 Plasma/KF6/Qt6 开发栈，满足版本下限
    # （Qt>=6.10 / KF6>=6.26 / Plasma>=6.6.90）。镜像为单架构（amd64），与本 job 匹配。
    container:
      image: invent-registry.kde.org/neon/docker-images/plasma:unstable
    steps:
      - uses: actions/checkout@v4

      # 容器预装最新 KDE 栈，补装编译工具与 WebEngine 预览依赖。
      # plasma-workspace-dev -> PlasmaConfig.cmake；qt6-declarative-dev-tools -> qmltestrunner。
      # 容器内通常为 root；若非 root 且有 sudo 则自动加前缀。
      - name: 安装系统依赖
        run: |
          SUDO=()
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null; then SUDO=(sudo); fi
          "${SUDO[@]}" apt-get update
          "${SUDO[@]}" apt-get install -y --no-install-recommends \
            gcc g++ ninja-build cmake extra-cmake-modules \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-webengine-dev plasma-workspace-dev \
            libgl1 libegl1 libglx-mesa0

      # 版本下限（Qt>=6.10 / KF6>=6.26 / Plasma>=6.6.90）由 find_package 兜底校验。
      - name: 配置与构建
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
            -DBUILD_TESTING=ON
          cmake --build build --parallel "$(nproc)"

      # C++ 数据层单测（tst_wallpaperproject / model / controller）：严格门禁，失败即红灯。
      # QML 测试：ThumbnailsPanel 已修复，不再容忍失败。
      - name: 运行测试
        run: |
          ctest --test-dir build --output-on-failure -R 'tst_wallpaper'
          ctest --test-dir build --output-on-failure -R '^tst_' -E 'tst_wallpaper'

      # 安装到 staging，供 release job 打包。
      - name: 安装到 staging
        run: cmake --install build --prefix build/staging

      - name: 上传安装产物
        uses: actions/upload-artifact@v4
        with:
          name: install-staging-amd64
          path: build/staging
          retention-days: 7
          if-no-files-found: error

  # ---------- 打 tag 时发布 ----------
  release:
    name: 发布到 GitHub Release
    needs: [build-amd64]
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-amd64.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: install-staging-*
          path: staging
          merge-multiple: false

      - name: 打包产物
        run: |
          ver="${GITHUB_REF_NAME#v}"
          for d in staging/install-staging-*; do
            [ -d "$d" ] || continue
            arch="${d##*-}"
            tar -C "$d" -czf "htmlwallpaper-${ver}-${arch}.tar.gz" .
          done
          ls -lh htmlwallpaper-*.tar.gz

      # release 不存在则创建（含自动 release notes），已存在则只补传资产。
      - name: 创建/更新 Release 并上传资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" htmlwallpaper-*.tar.gz --clobber
          else
            gh release create "${GITHUB_REF_NAME}" htmlwallpaper-*.tar.gz --generate-notes
          fi
