<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Dots</title>
    <style media="screen">
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #08303e;
        user-select: none;
        -webkit-user-select: none;
      }
      canvas {
        background: #08303e;
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <script src="particle.js"></script>
    <script>
      (function () {
        "use strict";

        var canvas = document.getElementById("canvas"),
          context = canvas.getContext("2d"),
          dpr = window.devicePixelRatio || 1,
          width = window.innerWidth,
          height = window.innerHeight,
          dots = [],
          multiplier = 5,
          leftRightAverageLowFreq = 0;

        /* DPR 高清适配：画布像素尺寸 × 设备像素比，逻辑坐标保持不变 */
        function resizeCanvas() {
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          context.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        /* 重建粒子（初始化与 resize 复用） */
        function createDots() {
          dots = [];
          var count = Math.floor(width / 20);
          for (var i = 0; i < count; i++) {
            var dot = particle.create(
              Math.random() * (width - width / 20) + width / 20,
              Math.random() * (height - height / 20) + height / 20,
              2,
              Math.random() * Math.PI * 2,
            );
            dot.color = "hsl(" + (i % 10) * 30 + ",100%,100%)";
            dot.size = Math.random() * 3 + 2;
            dot.setSpeed(dot.size / 8);
            dot.friction = 0.1;
            dots.push(dot);
          }
        }

        resizeCanvas();
        createDots();

        window.onload = function () {
          /* KDE 下无 Wallpaper Engine API，注册前先判断存在性，避免 TypeError */
          if (window.wallpaperRegisterAudioListener) {
            window.wallpaperRegisterAudioListener(wallpaperAudioListener);
          }
          window.wallpaperPropertyListener = {
            applyUserProperties: function (properties) {
              if (properties.multiplier) {
                multiplier = properties.multiplier.value;
              }
              if (properties.combo) {
                if (properties.combo.value == 1 && properties.background) {
                  var background = properties.background.value
                    .split(" ")
                    .map(function (c) {
                      return Math.ceil(c * 255);
                    });
                  canvas.style.background = "rgb(" + background + ")";
                } else if (properties.combo.value == 2 && properties.image) {
                  canvas.style.background = "url(file:///img)".replace(
                    "img",
                    properties.image.value,
                  );
                }
              } else {
                canvas.style.background = "#08303e";
              }
            },
          };
        };

        /* 音频回调：仅 Wallpaper Engine 会调用，KDE 下不会触发（保持默认静态动画） */
        function wallpaperAudioListener(audioArray) {
          var lowFreqs = audioArray
            .slice(0, 5)
            .concat(audioArray.slice(64, 64 + 5));
          var sum = lowFreqs.reduce(function (a, b) {
            return a + b;
          }, 0);
          leftRightAverageLowFreq = sum / lowFreqs.length;
        }

        function update() {
          context.clearRect(0, 0, width, height);

          var i,
            j,
            len = dots.length;
          for (i = 0; i < len; i++) {
            var dot = dots[i];

            var alpha = Number(100 - 14 * multiplier * leftRightAverageLowFreq);
            dot.color =
              "hsl(" +
              (i % 5) * 60 +
              ",100%," +
              (alpha > 50 ? alpha : 50) +
              "%)";

            dot.update();

            if (dot.x > width || dot.x < 0) {
              dot.vx *= -1;
              dot.x = dot.x > width ? width : 0;
            }
            if (dot.y > height || dot.y < 0) {
              dot.vy *= -1;
              dot.y = dot.y > height ? height : 0;
            }

            var radius = dot.size + 4 * multiplier * leftRightAverageLowFreq;
            context.beginPath();
            context.fillStyle = dot.color;
            context.arc(
              dot.x,
              dot.y,
              Math.min(radius, 20),
              0,
              Math.PI * 2,
              false,
            );
            dot.setSpeed(
              dot.size / 4 + multiplier * 20 * leftRightAverageLowFreq,
            );
            context.fill();

            /* 粒子连线 */
            for (j = 0; j < len; j++) {
              if (j === i) continue;
              var dist = dot.distanceTo(dots[j]);
              if (dist < 150) {
                context.beginPath();
                context.lineWidth = 3; /* 原代码误写 strokeWidth（无效属性），已修正 */
                context.strokeStyle =
                  "rgba(255,255,255," + (1 - dist / 150) + ")";
                context.moveTo(dot.x, dot.y);
                context.lineTo(dots[j].x, dots[j].y);
                context.stroke();
              }
            }
          }

          requestAnimationFrame(update);
        }
        update();

        window.onresize = function () {
          resizeCanvas();
          createDots();
        };
      })();
    </script>
  </body>
</html>
