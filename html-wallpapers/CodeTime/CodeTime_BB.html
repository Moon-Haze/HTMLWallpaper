<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Clock</title>
    <style>
        :root {
            --font-size: 25.2px;
            --gap: 56px;
            --clock-size: 140px;
            --hand-width: 2.8px;
        }

        /* 壁纸模式适配：不滚动、不选中、无鼠标指针 */
        html, body {
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            cursor: none;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            font-size: var(--font-size);
            line-height: 1.5;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
        }

        .container {
            display: flex;
            align-items: center;
            gap: var(--gap);
        }

        .code { color: #569cd6; }
        .number { color: #dcdcaa; }
        .string { color: #ce9178; }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 暗色渐变背景（固定，壁纸场景无需主题切换） */
        .animated-background-dark {
            background: linear-gradient(135deg, #2c3e50, #34495e, #1e1e1e);
            background-size: 200% 200%;
            animation: gradientShift 10s ease infinite;
        }

        .analog-clock {
            width: var(--clock-size);
            height: var(--clock-size);
            border: var(--hand-width) solid #d4d4d4;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 20px rgba(206, 145, 120, 0.8);
        }

        .hand {
            position: absolute;
            background: currentColor;
            transform-origin: bottom center;
        }

        .hour-hand { width: 5.6px; height: 42px; top: 28px; left: 67.2px; }
        .minute-hand { width: 4.2px; height: 56px; top: 14px; left: 67.9px; }
        .second-hand { width: 2.8px; height: 63px; top: 7px; left: 68.6px; background: #ce9178; }

        /* 中心点（暗色主题固定为白色） */
        .center-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }
    </style>
</head>
<body class="animated-background-dark">
    <div class="container">
        <pre id="code"></pre>
        <div class="analog-clock">
            <div class="hand hour-hand"></div>
            <div class="hand minute-hand"></div>
            <div class="hand second-hand"></div>
            <div class="center-dot"></div>
        </div>
    </div>

    <script>
        (function () {
            "use strict";
            // 缓存 DOM 引用，避免每秒重复查询
            var codeEl = document.getElementById("code");
            var hourHand = document.querySelector(".hour-hand");
            var minuteHand = document.querySelector(".minute-hand");
            var secondHand = document.querySelector(".second-hand");

            function updateTime() {
                var now = new Date();
                var hours = String(now.getHours()).padStart(2, "0");
                var minutes = String(now.getMinutes()).padStart(2, "0");
                var seconds = String(now.getSeconds()).padStart(2, "0");
                var year = now.getFullYear();
                var month = String(now.getMonth() + 1).padStart(2, "0");
                var day = String(now.getDate()).padStart(2, "0");
                // 星期跟随系统语言（原代码硬编码 "en"）
                var dayOfWeek = now.toLocaleString(undefined, { weekday: "long" });

                // 当天进度百分比
                var startOfDay = new Date(now);
                startOfDay.setHours(0, 0, 0, 0);
                var progress = ((now - startOfDay) / 86400000) * 100;

                // 格式化文本为代码样式（number 颜色由 CSS 类控制，不再内联）
                var codeString =
`
<span class="code">const</span> currentTime = {
    <span class="code">year</span>: <span class="number">${year}</span>,
    <span class="code">month</span>: <span class="number">${month}</span>,
    <span class="code">day</span>: <span class="number">${day}</span>,
    <span class="code">dayOfWeek</span>: <span class="string">"${dayOfWeek}"</span>,
    <span class="code">hour</span>: <span class="number">${hours}</span>,
    <span class="code">minute</span>: <span class="number">${minutes}</span>,
    <span class="code">second</span>: <span class="number">${seconds}</span>,
    <span class="code">dayProgress</span>: <span class="number">${progress.toFixed(2)}%</span>
};`;

                codeEl.innerHTML = codeString;

                // 模拟表盘指针
                var hourDeg = (now.getHours() % 12) * 30 + now.getMinutes() * 0.5;
                var minuteDeg = now.getMinutes() * 6 + now.getSeconds() * 0.1;
                var secondDeg = now.getSeconds() * 6;

                hourHand.style.transform = "rotate(" + hourDeg + "deg)";
                minuteHand.style.transform = "rotate(" + minuteDeg + "deg)";
                secondHand.style.transform = "rotate(" + secondDeg + "deg)";
            }

            // 每秒更新
            setInterval(updateTime, 1000);
            updateTime(); // 立即初始化
        })();
    </script>
</body>
</html>
